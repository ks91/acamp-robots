[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "acamp-robots"
version = "0.1.0"
description = "Academy Camp robot control environment for DOFBOT and Freenove Hexapod"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["pyserial>=3.5"]

[project.optional-dependencies]
dev = ["pytest>=8"]
vision = ["numpy>=1.24", "opencv-contrib-python-headless>=4.8"]

[project.scripts]
acamp-robot = "acamp_robots.cli:main"
acamp-doctor = "acamp_robots.doctor:main"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
